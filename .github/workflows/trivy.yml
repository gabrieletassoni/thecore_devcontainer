name: "Scan Docker Images"

# Scans the three published images (tag :3, the one host apps pull) with Trivy for
# fixable HIGH/CRITICAL vulnerabilities. Results go to the Security tab (code scanning).
# It runs after every successful build: after the nightly (scheduled) build it also fails
# when something not accepted in .trivyignore.yaml is found, so the owner gets GitHub's
# "workflow failed" mail. No cron of its own: it would scan an image older than the
# Debian fixes the next build picks up. See docs/agents/security-scanning.md.
on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [thecore-common, vscode-devcontainers-thecore, thecore]
    steps:
      # Actions pinned to commit SHAs: the aquasecurity action tags were hijacked in March 2026.
      - name: Scan for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: gabrieletassoni/${{ matrix.image }}:3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Only for the gate: the Security tab keeps showing the accepted CVEs.
      - name: Check out the accepted findings
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false

      - name: Fail the nightly run on findings
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: gabrieletassoni/${{ matrix.image }}:3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
