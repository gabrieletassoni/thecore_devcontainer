name: "Build and Push Docker Images"

on:
  push:
    branches:
      - release/3
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push-to-docker-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build and push to Docker Hub
        run: ./bin/build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source bin/version.sh
          if gh release view "${DOCKERVERSION}" > /dev/null 2>&1; then
            echo "Release ${DOCKERVERSION} already exists, skipping."
          else
            gh release create "${DOCKERVERSION}" \
              --title "Release ${DOCKERVERSION}" \
              --latest \
              --notes "Docker images published to Docker Hub:
          - \`gabrieletassoni/thecore-common:${DOCKERVERSION}\`
          - \`gabrieletassoni/vscode-devcontainers-thecore:${DOCKERVERSION}\`
          - \`gabrieletassoni/thecore:${DOCKERVERSION}\`" \
              --target "${{ github.sha }}"
          fi
