services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # - ..:/workspace:cached
      - ../:/workspaces/thecore_devcontainer:cached
      - ${HOME}/.docker/config.json:/home/vscode/.docker/config.json
      # - ../../dependencies:/workspaces/project/backend/vendor/dependencies:cached
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket keeps the host's gid; docker-socket-gid.sh (initializeCommand)
    # writes it to .devcontainer/.env. 996 is the dev image's own docker group.
    group_add:
      - "${DOCKER_SOCKET_GID:-996}"
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
